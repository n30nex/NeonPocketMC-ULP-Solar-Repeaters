; NeonPocketMC ULP Solar Repeater release matrix.
; Based on IoTThinks/MeshCore PowerSaving-v17. New installs start with MCU
; sleep and balanced SX1262/LR1110 RX duty cycling enabled.

[neonpocket_ulp_common]
build_flags =
  -D NEONPOCKET_ULP_SOLAR=1
  -D FIRMWARE_VERSION='"v1.17.1-neonpocket-ulp-v1.0.0-rc.1"'

[env:neonpocket_ulp_heltec_v3]
extends = env:Heltec_v3_repeater
build_flags =
  ${env:Heltec_v3_repeater.build_flags}
  ${neonpocket_ulp_common.build_flags}
  -D ADVERT_NAME='"NeonPocket ULP V3"'

[env:neonpocket_ulp_heltec_v4]
extends = env:heltec_v4_repeater
build_flags =
  ${env:heltec_v4_repeater.build_flags}
  ${neonpocket_ulp_common.build_flags}
  -D ADVERT_NAME='"NeonPocket ULP V4"'

[env:neonpocket_ulp_rak4631]
extends = env:RAK_4631_repeater
build_flags =
  ${env:RAK_4631_repeater.build_flags}
  ${neonpocket_ulp_common.build_flags}
  -D ADVERT_NAME='"NeonPocket ULP RAK4631"'

[env:neonpocket_ulp_rak3401_1w]
extends = env:RAK_3401_repeater
build_flags =
  ${env:RAK_3401_repeater.build_flags}
  ${neonpocket_ulp_common.build_flags}
  -D ADVERT_NAME='"NeonPocket ULP RAK 1W"'

[env:neonpocket_ulp_xiao_esp32s3]
extends = env:Xiao_S3_repeater
build_flags =
  ${env:Xiao_S3_repeater.build_flags}
  ${neonpocket_ulp_common.build_flags}
  -D ADVERT_NAME='"NeonPocket ULP Xiao S3"'

[env:neonpocket_ulp_xiao_nrf52840]
extends = env:Xiao_nrf52_repeater
build_flags =
  ${env:Xiao_nrf52_repeater.build_flags}
  ${neonpocket_ulp_common.build_flags}
  -D ADVERT_NAME='"NeonPocket ULP Xiao nRF"'

[neonpocket_ulp_rc52]
extends = nrf52_base
board = heltec_rc52
board_build.ldscript = boards/nrf52840_s140_v6.ld
build_flags =
  ${nrf52_base.build_flags}
  ${neonpocket_ulp_common.build_flags}
  -I lib/nrf52/s140_nrf52_6.1.1_API/include
  -I lib/nrf52/s140_nrf52_6.1.1_API/include/nrf52
  -I variants/heltec_rc52
  -D HELTEC_RC52=1
  -D NRF52_POWER_MANAGEMENT=1
  -D P_LORA_DIO_1=11
  -D P_LORA_NSS=13
  -D P_LORA_RESET=32
  -D P_LORA_BUSY=24
  -D P_LORA_SCLK=25
  -D P_LORA_MISO=14
  -D P_LORA_MOSI=22
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_RXEN=39
  -D PIN_USER_BTN=42
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<../variants/heltec_rc52>
  +<../examples/simple_repeater>
lib_deps =
  ${nrf52_base.lib_deps}
debug_tool = jlink
upload_protocol = nrfutil

[env:neonpocket_ulp_rc52_headless]
extends = neonpocket_ulp_rc52
build_flags =
  ${neonpocket_ulp_rc52.build_flags}
  -D ADVERT_NAME='"NeonPocket ULP RC52"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50

[env:neonpocket_ulp_rc52_tft]
extends = neonpocket_ulp_rc52
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${neonpocket_ulp_rc52.build_flags}
  -D ADVERT_NAME='"NeonPocket ULP RC52"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D DISPLAY_CLASS=NV3001BDisplay
  -D DISPLAY_REQUIRED=1
  -D NV3001B_USE_FRAMEBUFFER=1
  -D NV3001B_USE_INDEXED_FRAMEBUFFER=1
  -D NV3001B_LOGICAL_WIDTH=220
  -D NV3001B_LOGICAL_HEIGHT=128
  -D NV3001B_SCREEN_WIDTH=220
  -D NV3001B_SCREEN_HEIGHT=128
  -D DISPLAY_ROTATION=0
  -D SPI_FREQUENCY=8000000
build_src_filter = ${neonpocket_ulp_rc52.build_src_filter}
  +<helpers/ui/NV3001BDisplay.cpp>

[neonpocket_ulp_rcc6]
extends = esp32c6_base
board = heltec_rcc6
board_build.partitions = default_16MB.csv
board_build.flash_mode = dio
upload_protocol = esptool
build_flags =
  ${esp32c6_base.build_flags}
  ${neonpocket_ulp_common.build_flags}
  -I variants/heltec_rcc6
  -D HELTEC_RCC6=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D P_LORA_SCLK=21
  -D P_LORA_MISO=20
  -D P_LORA_MOSI=22
  -D P_LORA_NSS=23
  -D P_LORA_DIO_1=19
  -D P_LORA_BUSY=10
  -D P_LORA_RESET=8
  -D PIN_USER_BTN=9
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
  -D PIN_ADC_CTRL=5
  -D ADC_CTRL_ENABLED=HIGH
  -D PIN_VBAT_READ=6
  -D ADC_MULTIPLIER=4.95f
  -D PIN_TFT_CS=18
  -D PIN_TFT_EN=2
  -D PIN_TFT_BL=1
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D DISABLE_WIFI_OTA=1
build_src_filter = ${esp32c6_base.build_src_filter}
  +<../variants/heltec_rcc6>
  +<../examples/simple_repeater>
lib_deps = ${esp32c6_base.lib_deps}

[env:neonpocket_ulp_rcc6_headless]
extends = neonpocket_ulp_rcc6
build_flags =
  ${neonpocket_ulp_rcc6.build_flags}
  -D ADVERT_NAME='"NeonPocket ULP RCC6"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50

[env:neonpocket_ulp_rcc6_tft]
extends = neonpocket_ulp_rcc6
build_flags =
  ${neonpocket_ulp_rcc6.build_flags}
  -D ADVERT_NAME='"NeonPocket ULP RCC6"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D HELTEC_RCC6_WITH_DISPLAY=1
  -D DISPLAY_CLASS=NV3001BDisplay
  -D DISPLAY_REQUIRED=1
  -D NV3001B_USE_SOFTWARE_SPI=1
  -D NV3001B_USE_FAST_GPIO=1
  -D NV3001B_USE_FRAMEBUFFER=1
  -D NV3001B_USE_INDEXED_FRAMEBUFFER=1
  -D NV3001B_LOGICAL_WIDTH=220
  -D NV3001B_LOGICAL_HEIGHT=128
  -D NV3001B_SCREEN_WIDTH=220
  -D NV3001B_SCREEN_HEIGHT=128
  -D PIN_TFT_SCL=4
  -D PIN_TFT_SDA=15
  -D PIN_TFT_DC=3
  -D PIN_TFT_RST=0
  -D PIN_TFT_EN_ACTIVE=LOW
  -D PIN_TFT_BL_ACTIVE=HIGH
  -D DISPLAY_ROTATION=0
build_src_filter = ${neonpocket_ulp_rcc6.build_src_filter}
  +<helpers/ui/NV3001BDisplay.cpp>
